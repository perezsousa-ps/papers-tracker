<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Papers Científicos</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Papers Tracker">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0F172A',
              navy: '#1E293B',
              orange: '#F97316',
              orangeDark: '#EA580C',
              white: '#FFFFFF',
              grayText: '#94A3B8'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-black text-brand-white font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-brand-navy border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-orange p-2 rounded-lg text-white">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Tracker de Papers</h1>
          <p class="text-xs text-brand-grayText">Investigación y Envejecimiento Saludable</p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-brand-orange hover:bg-brand-orangeDark text-white font-semibold px-4 py-2 rounded-xl flex items-center space-x-2 transition-all shadow-lg shadow-orange-500/20">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="hidden sm:inline">Nuevo Paper</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Tarjetas KPI -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-brand-navy p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <p class="text-xs text-brand-grayText">Total Papers</p>
          <p id="kpi-total" class="text-2xl font-bold mt-1">10</p>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-brand-orange"><i data-lucide="file-text" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-brand-navy p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <p class="text-xs text-brand-grayText">En Redacción</p>
          <p id="kpi-redaccion" class="text-2xl font-bold mt-1 text-amber-400">3</p>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-amber-400"><i data-lucide="edit-3" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-brand-navy p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <p class="text-xs text-brand-grayText">En Revisión</p>
          <p id="kpi-revision" class="text-2xl font-bold mt-1 text-sky-400">4</p>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-sky-400"><i data-lucide="clock" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-brand-navy p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <p class="text-xs text-brand-grayText">Publicados</p>
          <p id="kpi-publicados" class="text-2xl font-bold mt-1 text-emerald-400">3</p>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-emerald-400"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
      </div>
    </div>

    <!-- Filtros de vista rápida -->
    <div class="flex space-x-2 overflow-x-auto pb-1">
      <button onclick="setFilter('todos')" id="filter-todos" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-brand-orange text-white">Todos</button>
      <button onclick="setFilter('revision')" id="filter-revision" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-sky-400 border border-slate-700">🔍 En Revisión</button>
      <button onclick="setFilter('redaccion')" id="filter-redaccion" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-amber-400 border border-slate-700">✍️ En Redacción</button>
      <button onclick="setFilter('publicado')" id="filter-publicado" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-emerald-400 border border-slate-700">✅ Publicados</button>
    </div>

    <!-- Lista de Manuscritos -->
    <div class="bg-brand-navy rounded-2xl border border-slate-800 overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="font-bold text-lg">Manuscritos Activos</h2>
        <span class="text-xs text-brand-grayText" id="paper-count-badge">10 manuscritos</span>
      </div>
      <div class="divide-y divide-slate-800" id="papers-list"></div>
    </div>
  </main>

  <!-- Modal para Agregar/Editar -->
  <div id="paper-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-brand-navy border border-slate-700 rounded-2xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg">Añadir / Editar Paper</h3>
        <button onclick="closeModal()" class="text-brand-grayText hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="paper-form" onsubmit="savePaper(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-brand-grayText mb-1">Título del Paper</label>
          <input type="text" id="input-title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
        </div>
        
        <!-- Nuevos campos de Autores -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Autor Principal</label>
            <input type="text" id="input-author" placeholder="Ej. Dr. Miguel Pérez" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Coautores / Roles</label>
            <input type="text" id="input-coauthors" placeholder="Ej. C. Gómez, M. Valdés" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Cohorte / Base de Datos</label>
            <input type="text" id="input-db" placeholder="Ej. SABE COLOMBIA" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Revista Objetivo</label>
            <input type="text" id="input-journal" placeholder="Ej. GEROSCIENCE" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Estado</label>
            <select id="input-status" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
              <option value="En redacción">En redacción</option>
              <option value="En revisión interna">En revisión interna</option>
              <option value="Enviado / Under Review">Enviado / Under Review</option>
              <option value="Revisión (Major/Minor)">Revisión (Major/Minor)</option>
              <option value="Aceptado">Aceptado</option>
              <option value="Publicado">Publicado</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-grayText mb-1">Autor de Correspondencia</label>
            <select id="input-corr" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
              <option value="No">No</option>
              <option value="Sí">Sí</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-grayText mb-1">Enlace a Word / Carpeta / Portal</label>
          <input type="url" id="input-doc-link" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-orange">
        </div>
        <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-brand-grayText hover:text-white">Cancelar</button>
          <button type="submit" class="bg-brand-orange hover:bg-brand-orangeDark text-white px-5 py-2 rounded-xl text-sm font-semibold">Guardar Paper</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const initialPapers = [
      { id: '1', title: 'Associations of muscle mass and strength with depressive symptoms among community-dwelling adults: A Cross-Sectional Study of the SABE study in Ecuador(GAM)', db: 'SABE ECUADOR', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'R. Ramírez-Vélez, A. García', status: 'Enviado / Under Review', journal: 'Aging medicine', link: 'https://mc.manuscriptcentral.com/agm2', corr: 'No' },
      { id: '2', title: 'Low relative STS power in Colombian older adults: cut-off points and associations with frailty and functionality (REGRESION CUANTILES)', db: 'SABE COLOMBIA', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'C. Cano, A. Izquierdo', status: 'Publicado', journal: 'The Journal of Frailty & Aging', link: '', corr: 'No' },
      { id: '3', title: 'The Synergistic Association of Obesity and Low Handgrip Strength on Cognitive Decline and Dementia', db: 'SABE COLOMBIA', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'L. Rodríguez, F. López', status: 'Publicado', journal: 'Frontiers in Nutrition', link: '', corr: 'No' },
      { id: '4', title: 'Novel and traditional anthropometric indices for predicting the risk of metabolic syndrome in the Chilean population', db: 'ENSE CHILE', author: 'Miguel Ángel Pérez-Sousa', coauthors: '', status: 'En redacción', journal: 'Por definir', link: '', corr: 'No' },
      { id: '5', title: 'Absolute and relative handgrip strength as indicators of cognitive impairment: Evidence from the Mexican cognitive aging study', db: 'MEX-COG', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'R. Ramírez-Vélez', status: 'Publicado', journal: 'The Journal of Aging Research & Lifestyle', link: '', corr: 'No' },
      { id: '6', title: 'Unified Handgrip Strength Cut-Offs (21/30 kg) for Functional Limitation: Cross-National Validation in Latin America', db: 'LATAM', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'Grupo Healthy-Age', status: 'En revisión interna', journal: 'GERIATRIC NURSING', link: '', corr: 'No' },
      { id: '7', title: 'Allometric Scaling of Handgrip Strength in Older Adults: Normative Values in Latin American Cohorts', db: 'LATAM', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'D. Silva', status: 'En redacción', journal: 'Brazilian Journal of Physical Therapy', link: '', corr: 'No' },
      { id: '8', title: 'Sex-Specific Associations Between Handgrip Strength and All-Cause Mortality in Older Mexican Adults', db: 'ENASEM MEXICO', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'H. Gutiérrez', status: 'Enviado / Under Review', journal: 'GEROSCIENCE', link: '', corr: 'No' },
      { id: '9', title: 'Exercise Intensity, Cardiorespiratory Fitness, and Attention Outcomes in Adolescents: A Secondary Analysis of the HEPAFIT Study', db: 'HEPAFIT COLOMBIA', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'J. Castro, M. Morales', status: 'Enviado / Under Review', journal: 'BMC Pediatrics', link: '', corr: 'No' },
      { id: '10', title: 'Bullying Victimization, Recreational Internet Use, Sleep, and Psychosomatic Symptoms Among Schoolchildren in Bogotá', db: 'HEPAFIT COLOMBIA', author: 'Miguel Ángel Pérez-Sousa', coauthors: 'R. Ramírez-Vélez', status: 'Enviado / Under Review', journal: 'Children and Youth Services Review', link: '', corr: 'Sí' }
    ];

    let papers = JSON.parse(localStorage.getItem('academic_papers_v4')) || initialPapers;
    let currentFilter = 'todos';

    function render() {
      const listEl = document.getElementById('papers-list');
      listEl.innerHTML = '';

      const filtered = papers.filter(p => {
        if (currentFilter === 'revision') return p.status.includes('Enviado') || p.status.includes('Revisión');
        if (currentFilter === 'redaccion') return p.status.includes('redacción') || p.status.includes('interna');
        if (currentFilter === 'publicado') return p.status === 'Publicado' || p.status === 'Aceptado';
        return true;
      });

      let stats = { redaccion: 0, revision: 0, publicados: 0 };
      papers.forEach(p => {
        if (p.status.includes('redacción') || p.status.includes('interna')) stats.redaccion++;
        else if (p.status.includes('Enviado') || p.status.includes('Revisión')) stats.revision++;
        else if (p.status === 'Publicado' || p.status === 'Aceptado') stats.publicados++;
      });

      filtered.forEach(p => {
        let badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        if (p.status.includes('Enviado') || p.status.includes('Revisión')) badgeColor = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
        if (p.status === 'Publicado' || p.status === 'Aceptado') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        listEl.innerHTML += `
          <div class="p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:bg-slate-800/50 transition-colors">
            <div class="space-y-1.5 max-w-2xl">
              <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                <span class="text-xs px-2 py-0.5 rounded border ${badgeColor} font-medium">${p.status}</span>
                <span class="text-xs bg-slate-800 text-brand-orange px-2 py-0.5 rounded font-bold">${p.db}</span>
                ${p.corr === 'Sí' ? `<span class="text-xs bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded">Autor Correspondiente</span>` : ''}
              </div>
              <h3 class="font-bold text-base leading-snug">${p.title}</h3>
              <p class="text-xs text-brand-grayText">
                <span class="text-slate-300 font-semibold">Autor:</span> ${p.author || 'Sin asignar'}
                ${p.coauthors ? `<span class="text-slate-400"> | Coautores: ${p.coauthors}</span>` : ''}
              </p>
              <p class="text-xs text-slate-400">
                <span>Revista: ${p.journal}</span>
              </p>
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
              ${p.link ? `
                <a href="${p.link}" target="_blank" class="bg-brand-orange/10 text-brand-orange hover:bg-brand-orange hover:text-white border border-brand-orange/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>Portal</span>
                </a>
              ` : ''}
              <select onchange="updateStatus('${p.id}', this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2 py-1.5 text-brand-white focus:border-brand-orange">
                <option value="En redacción" ${p.status==='En redacción'?'selected':''}>En redacción</option>
                <option value="En revisión interna" ${p.status==='En revisión interna'?'selected':''}>En revisión interna</option>
                <option value="Enviado / Under Review" ${p.status==='Enviado / Under Review'?'selected':''}>Enviado / Under Review</option>
                <option value="Revisión (Major/Minor)" ${p.status==='Revisión (Major/Minor)'?'selected':''}>Revisión (Major/Minor)</option>
                <option value="Aceptado" ${p.status==='Aceptado'?'selected':''}>Aceptado</option>
                <option value="Publicado" ${p.status==='Publicado'?'selected':''}>Publicado</option>
              </select>
            </div>
          </div>
        `;
      });

      document.getElementById('kpi-total').innerText = papers.length;
      document.getElementById('kpi-redaccion').innerText = stats.redaccion;
      document.getElementById('kpi-revision').innerText = stats.revision;
      document.getElementById('kpi-publicados').innerText = stats.publicados;
      document.getElementById('paper-count-badge').innerText = `${filtered.length} manuscritos`;
      lucide.createIcons();
    }

    function setFilter(type) {
      currentFilter = type;
      render();
    }

    function updateStatus(id, newStatus) {
      papers = papers.map(p => p.id === id ? { ...p, status: newStatus } : p);
      localStorage.setItem('academic_papers_v4', JSON.stringify(papers));
      render();
    }

    function openModal() { document.getElementById('paper-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('paper-modal').classList.add('hidden'); }

    function savePaper(e) {
      e.preventDefault();
      const p = {
        id: Date.now().toString(),
        title: document.getElementById('input-title').value,
        author: document.getElementById('input-author').value,
        coauthors: document.getElementById('input-coauthors').value,
        db: document.getElementById('input-db').value,
        journal: document.getElementById('input-journal').value,
        status: document.getElementById('input-status').value,
        corr: document.getElementById('input-corr').value,
        link: document.getElementById('input-doc-link').value
      };
      papers.unshift(p);
      localStorage.setItem('academic_papers_v4', JSON.stringify(papers));
      closeModal();
      render();
    }

    render();
  </script>
</body>
</html>
